version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - flutter
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    # Keep updates in the Android toolchain validated with pinned Flutter 3.41.4.
    # Revisit these bounds with the Flutter/AGP 9 migration; see docs/android-toolchain.md.
    ignore:
      - dependency-name: com.android.application
        versions: ['>=9.0.0']
      - dependency-name: gradle-wrapper
        versions: ['>=9.0.0']
      - dependency-name: org.jetbrains.kotlin.android
        versions: ['>=2.4.0']
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-dependencies:
        patterns:
          - '*'

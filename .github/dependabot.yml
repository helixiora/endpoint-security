version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - flutter
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-dependencies:
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      all-dependencies:
        patterns:
          - '*'
